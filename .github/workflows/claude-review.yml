# Automatic PR review — runs once when a PR opens or leaves draft, not on every push.
# Re-review any time by commenting "@claude review".
# Skips ticket/* branches: those were already reviewed by the reviewer subagent.
name: Claude review

on:
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false && !startsWith(github.head_ref, 'ticket/') && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR as described in .claude/agents/reviewer.md: real problems only
            (bug, security, missing test, spec gap), most severe first, with concrete fixes.
            Use `gh pr diff` and read surrounding code only where needed.
            Post inline comments with mcp__github_inline_comment__create_inline_comment and one
            summary with `gh pr comment`. If nothing is wrong, comment "LGTM" plus one line on risk.
          claude_args: >-
            --model sonnet
            --max-turns 12
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
