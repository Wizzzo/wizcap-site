# Chat with Claude on any issue or PR: write a comment containing @claude.
name: Claude (@mention)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.STUDIO_GH_TOKEN }}
          additional_permissions: |
            actions: read
          claude_args: >-
            --model sonnet
            --max-turns 30
            --allowedTools "Read,Edit,Write,Glob,Grep,Skill,Task,Agent,TodoWrite,Bash(make:*),Bash(git:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
